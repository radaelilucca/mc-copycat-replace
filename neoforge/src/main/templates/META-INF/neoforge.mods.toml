modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="Lucca"
description='''
Replace a copycat's material by using a Create wrench in one hand and the new material in the other.
'''
[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"
[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"
[[dependencies.${mod_id}]]
modId="create"
type="required"
versionRange="[6.0.10,7.0.0)"
ordering="AFTER"
side="BOTH"
[[dependencies.${mod_id}]]
modId="copycats"
type="optional"
versionRange="[3.0.4,4.0.0)"
ordering="AFTER"
side="BOTH"
