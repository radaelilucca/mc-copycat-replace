plugins { id 'net.neoforged.moddev' }
base.archivesName = "${mod_id}-neoforge-${minecraft_version}"
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
sourceSets.main.resources.srcDir rootProject.file('common/src/main/resources')
neoForge {
    version = neo_version
    parchment { minecraftVersion = parchment_minecraft_version; mappingsVersion = parchment_mappings_version }
    runs {
        configureEach { logLevel = org.slf4j.event.Level.INFO }
        client { client(); gameDirectory = file('runs/client') }
        server { server(); gameDirectory = file('runs/server'); programArgument '--nogui' }
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = file(providers.gradleProperty('withoutCopycats').isPresent() ? 'build/gametest-create' : 'build/gametest-copycats')
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
    }
    mods { "${mod_id}" { sourceSet sourceSets.main } }
}
def createJar = rootProject.file('libs/create-1.21.1-6.0.10.jar')
dependencies {
    implementation files(createJar)
    compileOnly zipTree(createJar).matching { include 'META-INF/jarjar/*.jar' }
    compileOnly files(rootProject.file('libs/copycats-3.0.4+mc.1.21.1-neoforge.jar'))
    if (!providers.gradleProperty('withoutCopycats').isPresent()) {
        runtimeOnly files(rootProject.file('libs/copycats-3.0.4+mc.1.21.1-neoforge.jar'))
    }
}
def metadata = tasks.register('generateModMetadata', ProcessResources) {
    def properties = [minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
        neo_version: neo_version, loader_version_range: loader_version_range, mod_id: mod_id,
        mod_name: mod_name, mod_license: mod_license, mod_version: mod_version]
    inputs.properties properties
    expand properties
    from 'src/main/templates'
    into layout.buildDirectory.dir('generated/modMetadata')
}
sourceSets.main.resources.srcDir metadata
neoForge.ideSyncTask metadata
processResources { from(rootProject.file('LICENSE')) { into 'META-INF' } }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 21 }
apply from: rootProject.file('gradle/verification.gradle')
