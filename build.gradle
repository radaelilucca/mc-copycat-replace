plugins {
    id 'base'
    id 'net.neoforged.moddev' version '2.0.144' apply false
    id 'net.minecraftforge.gradle' version '6.0.54' apply false
}
allprojects { group = mod_group_id; version = mod_version }
tasks.register('buildAll') {
    group = 'build'
    description = 'Builds Forge 1.20.1 and NeoForge 1.21.1 sequentially.'
    dependsOn ':forge1201:build', ':neoforge:build'
}
tasks.register('verifyAll') {
    group = 'verification'
    description = 'Checks artifacts and runs server GameTests for both loaders.'
    dependsOn ':forge1201:check', ':neoforge:check', ':forge1201:runGameTestServer', ':neoforge:runGameTestServer'
}
['Forge': 'forge1201', 'NeoForge': 'neoforge'].each { label, module ->
    tasks.register("run${label}Client") { dependsOn ":${module}:runClient" }
    tasks.register("run${label}Server") { dependsOn ":${module}:runServer" }
    tasks.register("run${label}GameTests") { dependsOn ":${module}:runGameTestServer" }
}
tasks.register('runClient') { dependsOn 'runNeoForgeClient' }
tasks.register('runServer') { dependsOn 'runNeoForgeServer' }
tasks.named('build') { dependsOn 'buildAll' }
tasks.named('check') { dependsOn 'verifyAll' }
tasks.named('wrapper') { gradleVersion = '8.11.1' }
gradle.projectsEvaluated {
    project(':neoforge').tasks.named('build') { mustRunAfter ':forge1201:build' }
    project(':neoforge').tasks.named('check') { mustRunAfter ':forge1201:check' }
    project(':forge1201').tasks.matching { it.name == 'runGameTestServer' }.configureEach { mustRunAfter ':forge1201:check', ':neoforge:check' }
    project(':neoforge').tasks.matching { it.name == 'runGameTestServer' }.configureEach { mustRunAfter ':forge1201:runGameTestServer' }
}
