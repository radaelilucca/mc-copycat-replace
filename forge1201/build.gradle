plugins { id 'net.minecraftforge.gradle' }
base.archivesName = "${mod_id}-forge-${forge_minecraft_version}"
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
sourceSets.main.resources.srcDir rootProject.file('common/src/main/resources')
repositories {
    mavenCentral()
    maven { url = 'https://maven.createmod.net' }
    maven { url = 'https://maven.ithundxr.dev/mirror' }
    flatDir { dirs rootProject.file('libs/forge1201') }
}
minecraft {
    mappings channel: 'official', version: forge_minecraft_version
    copyIdeResources = true
    runs {
        configureEach {
            property 'forge.logging.console.level', 'info'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', file('build/createSrgToMcp/output.srg').absolutePath
            mods { "${mod_id}" { source sourceSets.main } }
        }
        client { workingDirectory file('runs/client') }
        server { workingDirectory file('runs/server'); args '--nogui' }
        gameTestServer {
            workingDirectory file(providers.gradleProperty('withoutCopycats').isPresent() ? 'build/gametest-create' : 'build/gametest-copycats')
            property 'forge.enabledGameTestNamespaces', mod_id
        }
    }
}
dependencies {
    minecraft "net.minecraftforge:forge:${forge_minecraft_version}-${forge_version}"
    implementation fg.deobf('local:create-1.20.1:6.0.8')
    compileOnly fg.deobf('local:copycats:3.0.4+mc.1.20.1-forge')
    if (!providers.gradleProperty('withoutCopycats').isPresent()) {
        runtimeOnly fg.deobf('local:copycats:3.0.4+mc.1.20.1-forge')
    }
    // The full Create JAR supplies these at runtime through Jar-in-Jar.
    compileOnly fg.deobf('net.createmod.ponder:Ponder-Forge-1.20.1:1.0.91')
    compileOnly fg.deobf('com.tterrag.registrate:Registrate:MC1.20-1.3.3')
    compileOnly fg.deobf('dev.engine-room.flywheel:flywheel-forge-api-1.20.1:1.0.5')
}
processResources {
    def properties = [mod_id: mod_id, mod_name: mod_name, mod_version: mod_version, mod_license: mod_license, forge_version: forge_version]
    inputs.properties properties
    filesMatching('META-INF/mods.toml') { expand properties }
    from(rootProject.file('LICENSE')) { into 'META-INF' }
}
tasks.named('jar') { finalizedBy 'reobfJar' }
tasks.named('build') { dependsOn 'reobfJar' }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 17 }
apply from: rootProject.file('gradle/verification.gradle')
